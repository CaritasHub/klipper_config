# Machine routines
# Author: Longo Alex
#
# Overview: Defines common machine routines such as homing, quad gantry leveling
# and bed mesh calibration. These sections are typically included as part of the
# printer configuration.
#
# Usage:
#   Include `Routines.cfg` from the `snippets` directory. The file provides
#   settings for `SAFE_Z_HOME`, `QUAD_GANTRY_LEVEL` and `BED_MESH` as well as an
#   `idle_timeout` section.
#
# Parameters:
# - `quad_gantry_level.gantry_corners` – Gantry size for QGL.
# - `bed_mesh.points` – Probe points for mesh generation.
# - `idle_timeout.timeout` – Seconds before the printer idles (default 1800).
#
# Example:
#   [include printer_data/snippets/Routines.cfg]
#
#   ; Perform quad gantry leveling
#   QUAD_GANTRY_LEVEL

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

[safe_z_home]
##  XY Location of the Z Endstop Switch
home_xy_position:175,180
speed:50
z_hop:5

##  Use QUAD_GANTRY_LEVEL to level a gantry.
##  Min & Max gantry corners - measure from nozzle at MIN (0,0) and
##  MAX (250, 250), (300,300), or (350,350) depending on your printer size
[quad_gantry_level]
gantry_corners:
   -60,-10
   410,420
##  Probe points
points:
   50,25
   50,275
   300,275
   300,25

speed: 150
horizontal_move_z: 20
retries: 5
retry_tolerance: 0.0075
max_adjust: 10


# MESH
[bed_mesh]
speed: 80
horizontal_move_z: 10
mesh_min: 5, 30 
mesh_max: 345, 310 
probe_count: 5, 5
algorithm: bicubic
bicubic_tension: 0.2
