#####################################################################
#   Fan Control
#####################################################################
[controller_fan FLOW_IN]
pin: mcu:PE5
kick_start_time: 0.8
fan_speed: 1
heater: heater_bed

[controller_fan FLOW_OUT]
pin: mcu:PD12
kick_start_time: 0.8
fan_speed: 1
heater: heater_bed

[temperature_fan DRIVER_FAN]
pin: mcu:PA8
sensor_type: temperature_mcu
sensor_mcu: mcu
control: watermark
min_temp: 2
max_temp: 85
target_temp: 25

