# Fan and sensor definitions
# Author: Longo Alex
#
# Overview: Defines controller fans for cooling and a set of temperature sensors.
# Commented examples show optional case lighting and exhaust fans.
#
# Usage:
#   Include `FanANDSensor.cfg` from the `snippets` directory. The fans are
#   associated with bed temperature or MCU temperature and run automatically.
#
# Parameters:
# - `[controller_fan FLOW_IN]` and `[controller_fan FLOW_OUT]` configure intake
#   and exhaust fan pins and kick start times.
# - `[temperature_fan DRIVER_FAN]` monitors MCU temperature.
# - `[temperature_sensor raspberry]` reports the host CPU temperature.
#
# Example:
#   [include printer_data/snippets/FanANDSensor.cfg]

#####################################################################
#   Fan Control
#####################################################################
[controller_fan FLOW_IN]
pin: mcu:PE5
kick_start_time: 0.8
fan_speed: 1
heater: heater_bed

[controller_fan FLOW_OUT]
pin: mcu:PD12
kick_start_time: 0.8
fan_speed: 1
heater: heater_bed

[temperature_fan DRIVER_FAN]
pin: mcu:PA8
sensor_type: temperature_mcu
sensor_mcu: mcu
control: watermark
min_temp: 2
max_temp: 85
target_temp: 25

##  Exhaust fan - FAN3
