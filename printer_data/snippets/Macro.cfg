# General printer macros
# Author: Longo Alex
#
# Overview: This file defines general purpose gcode macros used during
# printing. It extends basic Klipper commands with additional logic for homing,
# quad gantry leveling and LED status feedback.
#
# Usage:
#   Include `Macro.cfg` from the `snippets` directory. Key macros are:
#   - `PRINT_END` – Performs safe heater shutdown, parks the toolhead and stores
#     the last printed file.
#   - `QUAD_GANTRY_LEVEL` – Wrapped to show LED status during leveling.
#   - `G28` – Homing routine with LED feedback.
#   - `LEDS_*` – Convenience macros for controlling the nozzle LEDs.
#
# Parameters:
#   These macros rely on variables stored in `_KNOMI_STATUS` and
#   `LAST_FILE_STORE`. No user parameters are normally required except those
#   accepted by standard Klipper commands.
#
# Example:
#   [include printer_data/snippets/Macro.cfg]
#
#   ; Start a print with automatic homing and LED indication
#   G28
#   QUAD_GANTRY_LEVEL

#####################################################################
#   Macros
#####################################################################

#########################################
#  LAST_FILE_STORE – ultimo file stampato
#########################################
[gcode_macro LAST_FILE_STORE]
description: Memorizza il nome dell’ultimo file stampato
variable_last_print_file: ""
gcode:

#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
[gcode_macro PRINT_END]
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 20, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    TURN_OFF_HEATERS
    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    _TOOLHEAD_PARK_PAUSE_CANCEL UP=0
    M107                                     ; turn off fan

    
    {% set CURRENT_FILE = printer["print_stats"].filename | default("") %}
    {% if CURRENT_FILE != "" %}
      SET_GCODE_VARIABLE MACRO=LAST_FILE_STORE VARIABLE=last_print_file VALUE={CURRENT_FILE}
    {% endif %}
    
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END


#############################################################################
# KNOMI MACRO
#
[gcode_macro _KNOMI_STATUS]
variable_homing: False
variable_probing: False
variable_qgling: False
variable_heating_nozzle: False
variable_heating_bed: False
gcode:

[gcode_macro M109]
rename_existing: M109.1
gcode:
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_nozzle VALUE=True
  M109.1 {rawparams}
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_nozzle VALUE=False

[gcode_macro M190]
rename_existing: M190.1
gcode:
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_bed VALUE=True
  M190.1 {rawparams}
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_bed VALUE=False

;_________________________________________________________________________________________________________________________________
; QGL

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: BTT_QUAD_GANTRY_LEVEL
gcode:
 SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=True
 LEDS_BLUE
 BTT_QUAD_GANTRY_LEVEL
 LEDS_GREEN
 SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=False

[gcode_macro _AUTO_QGL_CONDITIONAL]
description: "Home axes only if 30 minutes have passed since the last homing or after a print"
gcode:
    {% if printer.print_stats.state == "complete" or printer.quad_gantry_level.applied|lower == 'false' %}
        QUAD_GANTRY_LEVEL
    {% else %}
        # Saltare l'azzeramento se non necessario
        M117 "QGL skipped: Too soon"
    {% endif %}

;_________________________________________________________________________________________________________________
; G28

[gcode_macro G28]
rename_existing: G28.0
gcode:
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=True
  LEDS_RED
  G28.0 {rawparams}
  LEDS_BLUE
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=False

[gcode_macro _AUTO_HOME_CONDITIONAL]
description: "Home axes only if not homed or after a print"
gcode:
    {% if printer.print_stats.state == "complete" or ('xyz' not in printer.toolhead.homed_axes) %}
        G28
    {% else %}
        # Saltare l'azzeramento se non necessario
        M117 "Homing skipped: Unnecessary"
    {% endif %}

########################################################################
#		LEDS MACRO
########################################################################
[gcode_macro LEDS_WHITE]
gcode:
    SET_LED LED=leds_on_nozzle RED=1.0 GREEN=1.0 BLUE=1.0

[gcode_macro LEDS_RED]
gcode:
    SET_LED LED=leds_on_nozzle RED=1.0 GREEN=0.0 BLUE=0.0

[gcode_macro LEDS_GREEN]
gcode:
    SET_LED LED=leds_on_nozzle RED=0.0 GREEN=1.0 BLUE=0.0

[gcode_macro LEDS_BLUE]
gcode:
    SET_LED LED=leds_on_nozzle RED=0.0 GREEN=0.0 BLUE=1.0

[gcode_macro LEDS_OFF]
gcode:
    SET_LED LED=leds_on_nozzle RED=0.0 GREEN=0.0 BLUE=0.0

[gcode_macro _LED_STATUS]
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    LEDS_RED
  {% else %}
    {% if printer.quad_gantry_level.applied == False %}
      LEDS_BLUE
    {% else %}
      {% if printer.idle_timeout.state == 'Ready' %}
       {% if printer['filament_switch_sensor ToolHead_FS'].filament_detected == True %}
        LEDS_GREEN
       {% else %}
        LEDS_RED
       {% endif %}
      {% else %}
       {% if printer.idle_timeout.state == 'Printing' %}
        LEDS_WHITE
       {% endif %}
      {% endif %}
    {% endif %}
  {% endif %}



