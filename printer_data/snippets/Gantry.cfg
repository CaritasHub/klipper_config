# Gantry stepper configuration
# Author: Longo Alex
#
# Overview: Stepper configuration for the X and Y axes. Sets motor pins,
# endstop positions and driver settings.
#
# Usage:
#   Include `Gantry.cfg` from the `snippets` directory. No additional macros are
#   provided; these sections simply configure the steppers.
#
# Parameters:
# - `[stepper_x]` and `[stepper_y]` – Pin assignments and kinematic limits.
# - `[tmc2209 stepper_x]` / `[tmc2209 stepper_y]` – Driver currents.
#
# Example:
#   [include printer_data/snippets/Gantry.cfg]

#####################################################################
#   X/Y Stepper Settings
#####################################################################

##___________________________
##          X SETTINGS
##

[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper

##X ENDSTOP need modify
endstop_pin: EBBCan:PB6
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 40   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: false
run_current: 1.45


##_____________________________
##          Y SETTINGS
##          
[stepper_y]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper

##Y ENDSTOP
endstop_pin: PG9
position_min: 0
position_endstop: 355
position_max: 358
homing_speed: 40  #Max 100
homing_retract_dist:3
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_y]
uart_pin: PD11
interpolate: false
run_current: 1.45

##_____________________________
