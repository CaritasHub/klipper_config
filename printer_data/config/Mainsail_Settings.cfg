
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 40.0
variable_custom_park_y    : 354.0
variable_custom_park_dz   : 2.0

# Retrazione estesa (Bowden-like su Direct Drive)
variable_retract          : 20.0
variable_cancel_retract   : 21.0
variable_speed_retract    : 35.0
variable_unretract        : 20.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 15.0
variable_speed_move       : 100.0

# Comportamento alla cancellazione
variable_park_at_cancel   : True
# variable_park_at_cancel_x : 40.0
# variable_park_at_cancel_y : 355.0

# Timeout inattività impostato a 10 minuti (600 secondi)
variable_idle_timeout     : 600

# Runout sensor opzionale
variable_runout_sensor    : "filament_switch_sensor ToolHead_FS"

# Macro personalizzate utente
variable_user_pause_macro : ""
variable_user_resume_macro: ""
variable_user_cancel_macro: "_CANCEL_PRINT"

gcode:


[gcode_macro _CANCEL_PRINT]
description: Cancella la stampa e invalida il file precedente
gcode:
    CANCEL_PRINT
    SET_GCODE_VARIABLE MACRO=LAST_FILE_STORE VARIABLE=last_print_file VALUE=""
    RESPOND PREFIX="warn" MSG="Ultimo file stampato resettato."