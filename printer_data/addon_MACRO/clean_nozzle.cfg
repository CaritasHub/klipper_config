# Clean nozzle routine
# Author: Longo Alex
#
# Overview: Contains the `CLEAN_NOZZLE` macro which wipes the nozzle on a
# cleaning brush and optionally purges filament. It is useful before starting a
# print to ensure the nozzle is clear of debris.
#
# Usage:
#   Include `clean_nozzle.cfg` from `addon_MACRO` and run `CLEAN_NOZZLE`. The
#   macro homes the printer if necessary, heats the nozzle to
#   `variable_purge_temp_min` and performs the wipe routine.
#
# Parameters:
# - `FORCEPURGE` – Set to 1 (default) to heat to the purge temperature and
#   extrude filament before wiping. Use 0 to skip purging.
# - Additional variables inside the file define wipe positions and speeds.
#
# Example:
#   [include printer_data/addon_MACRO/clean_nozzle.cfg]
#
#   CLEAN_NOZZLE FORCEPURGE=1

[gcode_macro clean_nozzle]
variable_location_bucket_rear:      True
variable_enable_purge:              True
variable_purge_len:            60	         ; Amount of filament, in mm, to purge.
variable_purge_spd:           400	         ; Speed, in mm/min, of the purge.
variable_purge_temp_min:      200	         ; Minimum nozzle temperature to permit a purge. Otherwise, purge will not occur.
variable_purge_ret:             3         ; Retract length, in mm, after purging to prevent slight oozing. Adjust as necessary.
variable_ooze_dwell:            2            ; Dwell/wait time, in seconds, after purging and retracting.
variable_brush_top:             1 
variable_clearance_z:           5	         ; When traveling, but not cleaning, the clearance along the z-axis between nozzle and brush.
variable_wipe_qty:              3	         ; Number of complete (A complete wipe: left, right, left OR right, left, right) wipes.
variable_prep_spd_xy:        3000	         ; Travel (not cleaning) speed along x and y-axis in mm/min.
variable_prep_spd_z:         1500	         ; Travel (not cleaning) speed along z axis in mm/min.
variable_wipe_spd_xy:        5000	         ; Nozzle wipe speed in mm/min.
variable_brush_start:     75
variable_brush_width:          52	
variable_brush_front:       0          
variable_brush_depth:       0      
variable_bucket_left_width:    92   
variable_bucket_right_width:   40            
variable_bucket_gap:           22	
variable_bucket_start: 		0
variable_bucket_pos:            1	        

gcode:
   {% set heat_up = params.FORCEPURGE | default(1) | int %}
   {% if "xyz" in printer.toolhead.homed_axes %}
      _TOOLHEAD_PARK_PAUSE_CANCEL RETRACT=0 UP=0
      M82  ; Assicurati di iniziare in modalità assoluta
      SAVE_GCODE_STATE NAME=clean_nozzle
      G90   ; Movimento assoluto

      {% set previous_temperature = printer.extruder.target %}
      {% set Ry = printer.toolhead.axis_maximum.y | float %}
      
      {% if enable_purge and heat_up %}
         SET_GCODE_VARIABLE MACRO=clean_nozzle VARIABLE=bucket_pos VALUE={(range(2) | random)}
         G1 Z{brush_top + clearance_z} F{prep_spd_z}
         {% if location_bucket_rear %}
            G1 Y{Ry} F{prep_spd_xy}
         {% else %}
            G1 Y{brush_front + (brush_depth / 2)} F{prep_spd_xy}
         {% endif %}
         G1 X{bucket_start + (bucket_left_width / (2 - bucket_pos)) + (bucket_pos * bucket_gap) + (bucket_pos * (bucket_right_width / 2))}

         {% if previous_temperature < purge_temp_min %}
             {% if heat_up == 1 %}
               M109 S{purge_temp_min}
             {% endif %}
         {% endif %}
         
         ; Cambio temporaneo alla modalità relativa per il purge
         M83
         G1 E{purge_len} F{purge_spd} ; Purge il filamento
         G1 E-{purge_ret} F{purge_spd * 5} ; Retract per evitare perdite
         G4 P{ooze_dwell * 1000} ; Aspetta per stabilizzare
         M82 ; Torna alla modalità assoluta
      {% endif %}
      
      ; Pulizia della spazzola
      G1 X{brush_start + (brush_width * bucket_pos)} F{prep_spd_xy}
      G1 Z{brush_top + clearance_z} F{prep_spd_z}
      {% if location_bucket_rear %}
         G1 Y{Ry}
      {% else %}
         G1 Y{brush_front + (brush_depth / 2)}
      {% endif %}
      G1 Z{brush_top} F{prep_spd_z}
      
      {% for wipes in range(1, (wipe_qty + 1)) %}
         G1 X{brush_start + (brush_width * (1 - bucket_pos))} F{wipe_spd_xy}
         G1 X{brush_start + (brush_width * bucket_pos)} F{wipe_spd_xy}
      {% endfor %}
      
      G1 Z{brush_top + clearance_z} F{prep_spd_z}
      G1 X{bucket_start + (bucket_left_width / 4)} F{prep_spd_xy}
      
      ; Ripristina lo stato del G-code e posizione assoluta dell'estrusore
      RESTORE_GCODE_STATE NAME=clean_nozzle MOVE=1 MOVE_SPEED=50
      G92 E{purge_len - purge_ret} ; Allinea la posizione dell'estrusore
   {% else %}
      { action_raise_error("Please home your axes!") }
      M117 Please home first!
   {% endif %}
