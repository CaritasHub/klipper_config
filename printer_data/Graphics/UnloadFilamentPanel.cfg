# UnloadFilamentPanel macros
# Author: Longo Alex
#
# Overview: Provides an interactive panel for unloading filament. The macro
# retracts filament until the sensor no longer detects it and offers buttons to
# retract more or finish.
#
# Usage:
#   Include `UnloadFilamentPanel.cfg` from `Graphics` and run `UNLOAD_FILAMENT`.
#   The macro ensures the extruder is hot enough before retracting.
#
# Parameters:
# - Uses `extruder.min_extrude_temp` and `extruder.max_extrude_only_distance`.
# - Internal variable `retry` manages extra retraction attempts.
#
# Example:
#   [include printer_data/Graphics/UnloadFilamentPanel.cfg]
#
#   UNLOAD_FILAMENT

########################################################################
#               Unload Filament Panel
########################################################################


[gcode_macro UNLOAD_FILAMENT]
variable_retry: 0
variable_orig_temp: 0
gcode:
  {% set MIN_TEMP = printer.configfile.settings.extruder.min_extrude_temp|float %}
  {% set MAX_DIST = printer.configfile.settings.extruder.max_extrude_only_distance|float %}
  {% set SENSOR_DEFINED = 'filament_switch_sensor ToolHead_FS' in printer %}
  {% set ORIG_TEMP = printer.extruder.target %}
  SET_GCODE_VARIABLE MACRO=UNLOAD_FILAMENT VARIABLE=orig_temp VALUE={ORIG_TEMP}

  RESPOND TYPE=command MSG="action:prompt_begin Scarica filamento"
  SET_GCODE_VARIABLE MACRO=UNLOAD_FILAMENT VARIABLE=retry VALUE=0
  _UNLOAD_FILAMENT_INTERNAL

  {% if SENSOR_DEFINED %}
    {% set sensor = printer['filament_switch_sensor ToolHead_FS'] %}
    {% set SENSOR_TXT = 'Rilevato' if sensor.filament_detected else 'Non rilevato' %}
  {% else %}
    {% set SENSOR_TXT = 'Assente' %}
  {% endif %}

  RESPOND TYPE=command MSG="action:prompt_text Sensore: {{SENSOR_TXT}}"
  RESPOND TYPE=command MSG="action:prompt_button Ritrai ancora|_UNLOAD_FILAMENT_MORE"
  RESPOND TYPE=command MSG="action:prompt_button Fatto|_UNLOAD_FILAMENT_DONE|primary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _UNLOAD_FILAMENT_INTERNAL]
gcode:
  {% set MAX_DIST = printer.configfile.settings.extruder.max_extrude_only_distance|float %}
  {% set SENSOR_DEFINED = 'filament_switch_sensor ToolHead_FS' in printer %}
  {% set retry = printer['gcode_macro UNLOAD_FILAMENT'].retry|int %}
  {% set MAX_RETRY = 3 %}

  _CHECK_TEMP_AND_EXTRUDE DIST={-MAX_DIST}

  {% if SENSOR_DEFINED %}
    {% set sensor = printer['filament_switch_sensor ToolHead_FS'] %}
    {% if sensor.enabled %}
      {% if not sensor.filament_detected %}
          _CHECK_TEMP_AND_EXTRUDE DIST={-MAX_DIST}
      {% else %}
          {% if retry < MAX_RETRY %}
              SET_GCODE_VARIABLE MACRO=UNLOAD_FILAMENT VARIABLE=retry VALUE={retry + 1}
              _UNLOAD_FILAMENT_INTERNAL
          {% endif %}
      {% endif %}
    {% endif %}
  {% endif %}

[gcode_macro _UNLOAD_FILAMENT_MORE]
gcode:
  {% set MAX_DIST = printer.configfile.settings.extruder.max_extrude_only_distance|float %}
  _CHECK_TEMP_AND_EXTRUDE DIST={-MAX_DIST}

[gcode_macro _UNLOAD_FILAMENT_DONE]
gcode:
  {% set ORIG = printer['gcode_macro UNLOAD_FILAMENT'].orig_temp|float %}
  {% set MIN_TEMP = printer.configfile.settings.extruder.min_extrude_temp|float %}
  {% if printer.extruder.target|float == MIN_TEMP %}
      M104 S{ORIG}
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_end"
