# PrintStartPanel macros
# Author: Longo Alex
#
# Overview: Adds a graphical prompt before printing so the user can choose
# whether to perform bed meshing or nozzle cleaning. The macros manage preheat,
# homing and optional preparation steps.
#
# Usage:
#   Include `PrintStartPanel.cfg` from `Graphics` and call `PRINT_START_PANEL`.
#   The panel displays buttons that control the variables used by `START_PRINT`.
#
# Parameters:
# - `BED_TEMP` and `EXTRUDER_TEMP` set the desired temperatures.
# - `DO_BED_MESH` and `DO_CLEAN_NOZZLE` enable or skip each preparation step.
# - `SBM` can force skipping bed mesh when the same file is printed again.
#
# Example:
#   [include printer_data/Graphics/PrintStartPanel.cfg]
#
#   ; Show the preparation panel and start printing
#   PRINT_START_PANEL BED_TEMP=60 EXTRUDER_TEMP=190
#
########################################################################
#               GRAPHIC MOD
########################################################################
; ====== Klipper UI Macros – Bed Mesh & Clean Nozzle prompt ======
; REQUIREMENTS
; 1. Mainsail ≥v2.9
;=====================================================================



[gcode_macro TMP_STORE]
variable_do_bed_mesh: 1
variable_do_clean_nozzle: 1
variable_panel_in_progress: 0
variable_bed_temp: 60
variable_ex_temp: 190
gcode:

[gcode_macro PRINT_START_PANEL]
description: Mostra UI e attende scelta preparazione
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}

  SET_GCODE_VARIABLE MACRO=TMP_STORE VARIABLE=bed_temp VALUE={BED_TEMP}
  SET_GCODE_VARIABLE MACRO=TMP_STORE VARIABLE=ex_temp VALUE={EXTRUDER_TEMP}

  SET_GCODE_VARIABLE MACRO=TMP_STORE VARIABLE=panel_in_progress VALUE=1

  RESPOND TYPE=command MSG="action:prompt_begin Scelta pre-stampa"
  RESPOND TYPE=command MSG="action:prompt_text Seleziona le operazioni da eseguire prima della stampa:"

  RESPOND TYPE=command MSG="action:prompt_button Bed Mesh + Clean Nozzle|_CONFIRM_PRINT_START BM=1 CN=1|primary"
  RESPOND TYPE=command MSG="action:prompt_button Solo Bed Mesh|_CONFIRM_PRINT_START BM=1 CN=0"
  RESPOND TYPE=command MSG="action:prompt_button Solo Clean Nozzle|_CONFIRM_PRINT_START BM=0 CN=1"
  RESPOND TYPE=command MSG="action:prompt_button Nessuna Preparazione|_CONFIRM_PRINT_START BM=0 CN=0|secondary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Annulla|CANCEL_PRINT|error"
  RESPOND TYPE=command MSG="action:prompt_show"
  PAUSE

[gcode_macro _CONFIRM_PRINT_START]
description: Imposta variabili e chiude il prompt
gcode:
  {% set BM = params.BM|default(1)|int %}
  {% set CN = params.CN|default(1)|int %}
  SET_GCODE_VARIABLE MACRO=TMP_STORE VARIABLE=do_bed_mesh VALUE={BM}
  SET_GCODE_VARIABLE MACRO=TMP_STORE VARIABLE=do_clean_nozzle VALUE={CN}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESUME
  M400
  START_PRINT

[gcode_macro START_PRINT]
description: Start print con Bed Mesh / Clean Nozzle opzionali + skip mesh se stesso file

# Parametri:
#   BED_TEMP        – temperatura letto
#   EXTRUDER_TEMP   – temperatura estrusore
#   DO_BED_MESH     – 1 abilita, 0 salta (default 1)
#   DO_CLEAN_NOZZLE – 1 abilita, 0 salta (default 1)
#   SBM             – 1 forza skip mesh (compatibilità)
gcode:
    {% set DO_BED_MESH = printer['gcode_macro TMP_STORE'].do_bed_mesh|int %}
    {% set DO_CLEAN_NOZZLE = printer['gcode_macro TMP_STORE'].do_clean_nozzle|int %}
    {% set BED_TEMP = printer['gcode_macro TMP_STORE'].bed_temp|float %}
    {% set EXTRUDER_TEMP = printer['gcode_macro TMP_STORE'].ex_temp|float %}

    {% set SBM = params.sbm|default(0)|int %}

    {% set CURRENT_FILE = printer['print_stats'].filename|default("") %}
    {% set LAST_FILE = printer['gcode_macro LAST_FILE_STORE'].last_print_file|default("") %}
    {% set SAME_FILE = (CURRENT_FILE != "") and (CURRENT_FILE == LAST_FILE) %}

    ; --- Skip bed mesh solo se stesso file (nozzle cleaning resta attivo) ---
    {% if SAME_FILE and SBM < 1 %}
        RESPOND PREFIX="info" MSG="Bed Mesh skippata: file identico alla stampa precedente."
        {% set DO_BED_MESH = 0 %}
    {% endif %}

    ; --- Preparazione ---
    M82 ; modalità estrusione assoluta
    M106 S100 ; ventola accesa bassa per sicurezza

    {% set ACTUAL_BED_TEMP = printer.heater_bed.temperature|float %}
    {% set ACTUAL_HOTEND_TEMP = printer.extruder.temperature|float %}

    ; --- Pre-riscaldamento veloce ---
    {% if ACTUAL_BED_TEMP < (BED_TEMP - 10) %}
        M140 S{BED_TEMP - 10}
    {% endif %}

    {% if ACTUAL_HOTEND_TEMP < 100 %}
        M104 S100 ; pre-riscaldamento hotend
    {% endif %}

    M400
    _AUTO_HOME_CONDITIONAL

    ; --- Aspetta temperatura letto completa ---
    {% if ACTUAL_BED_TEMP < BED_TEMP %}
        M190 S{BED_TEMP}
    {% endif %}

    M400
    _AUTO_QGL_CONDITIONAL

    ; --- Bed Mesh Calibrazione ---
    {% if DO_BED_MESH and SBM < 1 %}
        LEDS_BLUE
        M400
        BED_MESH_CLEAR
        BED_MESH_CALIBRATE ADAPTIVE=1
        LEDS_GREEN
    {% endif %}

    ; --- Pulizia nozzle se abilitata ---
    {% if DO_CLEAN_NOZZLE %}
        M109 S{EXTRUDER_TEMP}
        clean_nozzle
    {% else %}
        RESPOND PREFIX="warn" MSG="Pulizia Nozzle skippata."
    {% endif %}

    ; --- Temperatura finale in attesa (per sicurezza) ---
    M190 S{BED_TEMP}
    M104 S{EXTRUDER_TEMP}
    M109 S{EXTRUDER_TEMP}

    M107 ; ventola off (verrà gestita dal gcode)
    _LED_STATUS
