# LoadFilamentPanel macros
# Author: Longo Alex
#
# Overview: Provides an interactive UI to assist with loading filament. The
# macro heats the extruder if necessary and extrudes until the filament sensor
# detects presence.
#
# Usage:
#   Include `LoadFilamentPanel.cfg` from `Graphics` and invoke the
#   `LOAD_FILAMENT` macro. The panel offers buttons to extrude more or finish
#   once filament is detected.
#
# Parameters:
# - Uses `extruder.min_extrude_temp` and
#   `extruder.max_extrude_only_distance` from your printer configuration.
# - Internal variable `retry` controls automatic retries when no filament is
#   detected.
#
# Example:
#   [include printer_data/Graphics/LoadFilamentPanel.cfg]
#
#   LOAD_FILAMENT

########################################################################
#               Load Filament Panel
########################################################################

[gcode_macro _CHECK_TEMP_AND_EXTRUDE]
description: "Ensure temp >= MIN_EXTRUDE_TEMP then extrude the requested distance"
gcode:
  {% set DIST = params.DIST|float %}
  {% set MIN_TEMP = printer.configfile.settings.extruder.min_extrude_temp|float %}
  {% if printer.extruder.temperature < MIN_TEMP %}
      M109 S{MIN_TEMP}
  {% endif %}
  M83
  G1 E{DIST} F600
  M400

[gcode_macro LOAD_FILAMENT]
variable_retry: 0
gcode:
  {% set MIN_TEMP = printer.configfile.settings.extruder.min_extrude_temp|float %}
  {% set MAX_DIST = printer.configfile.settings.extruder.max_extrude_only_distance|float %}
  {% set SENSOR_DEFINED = 'filament_switch_sensor ToolHead_FS' in printer %}
  {% set ORIG_TEMP = printer.extruder.target %}

  RESPOND TYPE=command MSG="action:prompt_begin Carica filamento"
  SET_GCODE_VARIABLE MACRO=LOAD_FILAMENT VARIABLE=retry VALUE=0
  _LOAD_FILAMENT_INTERNAL
  M104 S{ORIG_TEMP}

  {% if SENSOR_DEFINED %}
    {% set sensor = printer['filament_switch_sensor ToolHead_FS'] %}
    {% set SENSOR_TXT = 'Rilevato' if sensor.filament_detected else 'Non rilevato' %}
  {% else %}
    {% set SENSOR_TXT = 'Assente' %}
  {% endif %}

  RESPOND TYPE=command MSG="action:prompt_text Sensore: {{SENSOR_TXT}}"
  RESPOND TYPE=command MSG="action:prompt_button Estrudi ancora|_LOAD_FILAMENT_MORE"
  RESPOND TYPE=command MSG="action:prompt_button Fatto|_LOAD_FILAMENT_DONE|primary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _LOAD_FILAMENT_INTERNAL]
gcode:
  {% set MAX_DIST = printer.configfile.settings.extruder.max_extrude_only_distance|float %}
  {% set SENSOR_DEFINED = 'filament_switch_sensor ToolHead_FS' in printer %}
  {% set retry = printer['gcode_macro LOAD_FILAMENT'].retry|int %}
  {% set MAX_RETRY = 3 %}

  _CHECK_TEMP_AND_EXTRUDE DIST={MAX_DIST}

  {% if SENSOR_DEFINED %}
    {% set sensor = printer['filament_switch_sensor ToolHead_FS'] %}
    {% if sensor.enabled %}
      {% if sensor.filament_detected %}
          _CHECK_TEMP_AND_EXTRUDE DIST={MAX_DIST}
      {% else %}
          {% if retry < MAX_RETRY %}
              SET_GCODE_VARIABLE MACRO=LOAD_FILAMENT VARIABLE=retry VALUE={retry + 1}
              _LOAD_FILAMENT_INTERNAL
          {% endif %}
      {% endif %}
    {% endif %}
  {% endif %}

[gcode_macro _LOAD_FILAMENT_MORE]
gcode:
  {% set MAX_DIST = printer.configfile.settings.extruder.max_extrude_only_distance|float %}
  _CHECK_TEMP_AND_EXTRUDE DIST={MAX_DIST}

[gcode_macro _LOAD_FILAMENT_DONE]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
