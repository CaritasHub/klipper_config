# variables
# Author: Longo Alex
#
# Overview: Placeholder file for Klipper's `SAVE_VARIABLE` feature. It is
# typically used by macros to store persistent values between printer restarts.
#
# Usage:
#   Include `variables.cfg` from the `temps` directory if your macros need to
#   store values using `SAVE_VARIABLE`. The file itself contains no settings.
#
# Parameters:
#   None.
#
# Example:
#   [include printer_data/temps/variables.cfg]
